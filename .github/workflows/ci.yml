name: Validate Next.js registry
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:photos
      - run: npm run test:identity
      - run: npm run test:data-api
      - run: npm run test:postgres
      - run: npm run test:runtime
      - run: npm run test:quality
      - run: npm run test:imports
      - run: npm run test:reports
      - run: npm run build
